name: secret-scan

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: "gitleaks release tag (e.g. v8.21.2)"
        type: string
        default: "v8.21.2"
      config-path:
        description: "Path to gitleaks config (skipped if file doesn't exist; pass empty to never use --config)"
        type: string
        default: ".gitleaks.toml"
      source-path:
        description: "Path to scan"
        type: string
        default: "."

jobs:
  scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          v="${{ inputs.gitleaks-version }}"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/${v}/gitleaks_${v#v}_linux_x64.tar.gz" -O /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: |
          set -euo pipefail
          args=(detect --no-git --verbose --source "${{ inputs.source-path }}")
          if [ -n "${{ inputs.config-path }}" ] && [ -f "${{ inputs.config-path }}" ]; then
            args+=(--config "${{ inputs.config-path }}")
          fi
          gitleaks "${args[@]}"
