name: test-e2e-dotnet-playwright

on:
  workflow_call:
    inputs:
      project-path:
        description: "Path to the E2E .csproj"
        type: string
        required: true
      test-filter:
        description: "dotnet test filter"
        type: string
        default: "Category=E2E"
      backend-url:
        description: "E2E_BACKEND_URL env var passed to the test run"
        type: string
        required: true
      frontend-url:
        description: "E2E_FRONTEND_URL env var"
        type: string
        required: true
      retries:
        description: "Re-runs after the first failure (1 = two attempts total)"
        type: number
        default: 1
      submodules:
        description: "Checkout with submodules"
        type: boolean
        default: true
      playwright-image:
        description: |
          Image used to run dotnet test. Must have a .NET SDK that can build
          the project AND the Playwright runtime + browsers + Linux system deps
          preinstalled. Default tracks Playwright's main (currently the only
          tag built on dotnet/sdk:10.0-noble — every published vX.Y.Z-noble
          through v1.59 ships .NET 8 SDK only). Pin to v1.60+-noble once
          Playwright cuts a stable release with .NET 10 SDK.
        type: string
        default: "mcr.microsoft.com/playwright/dotnet:next-noble"

jobs:
  e2e:
    name: test-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Run E2E tests in Playwright image
        env:
          IMAGE: ${{ inputs.playwright-image }}
          PROJECT: ${{ inputs.project-path }}
          FILTER: ${{ inputs.test-filter }}
          RETRIES: ${{ inputs.retries }}
          E2E_BACKEND_URL: ${{ inputs.backend-url }}
          E2E_FRONTEND_URL: ${{ inputs.frontend-url }}
        run: |
          set -euo pipefail

          # Pull explicitly so image-fetch time isn't billed to (or pushed past
          # the timeout of) the first test attempt.
          docker pull "$IMAGE"

          # The Forgejo runner already executes inside a container and mounts
          # /workspace from the host into the same path; binding $PWD here
          # therefore resolves to the *host* path that the docker daemon needs.
          # --network host  → tests can reach backend-url / frontend-url without
          #                   an extra docker network hop or DNS setup.
          # --ipc host      → Playwright recommendation: Chromium uses shared
          #                   memory for IPC and the default 64 MB /dev/shm
          #                   inside a container makes it crash with
          #                   Target.crashed errors after a page or two.
          attempt=1
          max=$((RETRIES + 1))
          while [ "$attempt" -le "$max" ]; do
            echo "::group::E2E attempt $attempt/$max — image=$IMAGE"
            if docker run --rm \
                  --network host \
                  --ipc host \
                  -v "$PWD:/work" -w /work \
                  -e E2E_BACKEND_URL \
                  -e E2E_FRONTEND_URL \
                  -e DOTNET_NOLOGO=1 \
                  -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
                  "$IMAGE" \
                  dotnet test "$PROJECT" --filter "$FILTER" --verbosity normal; then
              if [ "$attempt" -gt 1 ]; then
                echo "::warning::E2E was flaky but passed on attempt $attempt"
              fi
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            attempt=$((attempt + 1))
          done

          echo "E2E failed after $max attempts."
          exit 1
