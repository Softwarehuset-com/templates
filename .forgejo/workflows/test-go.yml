name: test-go

# Reusable Go test workflow, matching the test-node / test-python / test-dotnet
# templates: install Go, optionally auto-start a docker-compose (e.g. Postgres),
# then `go vet` + `go test ./...`. When a compose Postgres is detected its mapped
# host port is exported as TEST_DATABASE_URL (postgres://postgres:postgres@...),
# which DB-gated Go tests can read.

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to install (e.g. 1.26)"
        type: string
        default: "1.26"
      working-directory:
        description: "Directory to run go commands in"
        type: string
        default: "."
      docker-compose:
        description: "Auto-detect and start docker compose if present"
        type: boolean
        default: true
      submodules:
        description: "Checkout with submodules"
        type: boolean
        default: true
      etcd:
        description: "Start an etcd container and export TEST_ETCD_URL for store-backed tests"
        type: boolean
        default: false
    # NOTE: Forgejo does not support 'secrets' in workflow_call.
    # Secrets are inherited automatically from the calling workflow.

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}
          token: ${{ secrets.TOKEN || github.token }}

      - name: Install Go
        run: |
          set -euo pipefail
          VER="${{ inputs.go-version }}"
          # Resolve a minor version (e.g. "1.26") to the latest patch release.
          # Go tarballs are named with the full version (go1.26.0.linux-amd64.tar.gz),
          # so a bare "1.26" 404s on go.dev/dl.
          FULL=$(curl -fsSL "https://go.dev/dl/?mode=json&include=all" \
              | grep -oE "\"version\": *\"go${VER}\.[0-9]+\"" \
              | grep -oE "go${VER}\.[0-9]+" \
              | sort -V | tail -1 | sed 's/^go//')
          if [ -z "$FULL" ]; then
            # Input was already a full version (e.g. 1.26.0) — use as-is.
            FULL="$VER"
          fi
          echo "Installing Go ${FULL} (requested ${VER})"
          curl -fsSL "https://go.dev/dl/go${FULL}.linux-amd64.tar.gz" -o /tmp/go.tgz
          # Install under $HOME (no root/sudo needed).
          mkdir -p "$HOME/.go"
          tar -C "$HOME/.go" --strip-components=1 -xzf /tmp/go.tgz
          echo "$HOME/.go/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/.go/bin/go" version

      - name: Start docker compose
        id: docker
        if: ${{ inputs.docker-compose }}
        run: |
          COMPOSE_FILE=$(find . -maxdepth 3 -name "docker-compose.yml" -o -name "docker-compose.yaml" -o -name "compose.yml" -o -name "compose.yaml" | grep -v vendor | head -1)
          if [ -z "$COMPOSE_FILE" ]; then
            echo "compose_found=false" >> $GITHUB_OUTPUT
            echo "No docker-compose file found, skipping"
            exit 0
          fi
          COMPOSE_DIR=$(dirname "$COMPOSE_FILE")
          echo "compose_dir=$COMPOSE_DIR" >> $GITHUB_OUTPUT
          echo "compose_found=true" >> $GITHUB_OUTPUT
          echo "Found compose file: $COMPOSE_FILE"
          cd "$COMPOSE_DIR"
          docker compose up -d
          # If a postgres service is present, wait for it and export its URL.
          if docker compose ps --services | grep -q '^postgres$'; then
            echo "Waiting for PostgreSQL..."
            for i in $(seq 1 60); do
              if docker compose exec -T postgres pg_isready >/dev/null 2>&1; then
                echo "PostgreSQL ready (attempt $i)"
                break
              fi
              sleep 2
            done
            PG_PORT=$(docker compose port postgres 5432 | cut -d: -f2)
            if [ -n "$PG_PORT" ]; then
              echo "pg_port=$PG_PORT" >> $GITHUB_OUTPUT
              echo "TEST_DATABASE_URL=postgres://postgres:postgres@localhost:${PG_PORT}/postgres?sslmode=disable" >> $GITHUB_ENV
              echo "Postgres available on host port $PG_PORT"
            fi
          fi

      - name: Start etcd
        if: ${{ inputs.etcd }}
        run: |
          set -euo pipefail
          # Bare-metal shared runners: unique name + ephemeral port so concurrent
          # jobs on the same runner never collide, and clear any stale container.
          NAME="ci-etcd-${GITHUB_RUN_ID}"
          ETCD_PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          docker run -d --rm --name "$NAME" -p "127.0.0.1:${ETCD_PORT}:2379" gcr.io/etcd-development/etcd:v3.5.17 \
            etcd --name test --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://0.0.0.0:2379
          echo "Waiting for etcd..."
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${ETCD_PORT}/health"; then break; fi
            sleep 1
          done
          echo "TEST_ETCD_URL=etcd://127.0.0.1:${ETCD_PORT}/" >> "$GITHUB_ENV"
          echo "etcd available on host port ${ETCD_PORT}"

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: |
          go vet ./...
          go test ./...

      - name: Stop docker compose
        if: always() && steps.docker.outputs.compose_found == 'true'
        run: |
          cd "${{ steps.docker.outputs.compose_dir }}"
          docker compose down || true

      - name: Stop etcd
        if: always() && inputs.etcd
        run: docker rm -f "ci-etcd-${GITHUB_RUN_ID}" || true
