name: schema-drift-graphql

# Re-export the GraphQL schema from a .NET backend, regenerate the typed
# frontend client, and fail if either committed file is stale (or if the
# regen surfaces any unresolved field references). Catches FE/BE GraphQL
# drift before merge instead of in the browser.
#
# All installs are shell-based — Forgejo Actions can't run node24-based
# third-party setup actions (`actions/setup-dotnet@v4`, `oven-sh/setup-bun@v2`,
# etc.) so this template uses the same dotnet-install.sh + bun curl-installer
# pattern that the rest of softwarehuset/templates relies on.

on:
  workflow_call:
    inputs:
      backend-project:
        description: "Path to the .NET project that exports the schema (e.g. backend/MyApp.Api/MyApp.Api.csproj)"
        type: string
        required: true
      schema-output:
        description: "Where the backend writes the schema (also the path that's diffed)"
        type: string
        default: "schema.graphql"
      schema-export-args:
        description: "Args appended after `dotnet run --project <backend-project> --` to trigger the export. Default writes to <schema-output>."
        type: string
        default: ""
      frontend-dir:
        description: "Working directory containing package.json + codegen config"
        type: string
        default: "frontend"
      package-manager:
        description: "Frontend package manager (bun, npm, pnpm, yarn)"
        type: string
        default: "bun"
      install-cmd:
        description: "Override for the install command (empty = sensible default per package-manager)"
        type: string
        default: ""
      codegen-cmd:
        description: "Override for the codegen command (empty = `<package-manager> run codegen`)"
        type: string
        default: ""
      drift-paths:
        description: "Space-separated paths to `git diff --exit-code` after regen. The schema-output path is always included."
        type: string
        default: "frontend/src/gql/"
      dotnet-channel:
        description: ".NET channel to install"
        type: string
        default: "10.0"
      submodules:
        description: "Checkout with submodules"
        type: boolean
        default: false

jobs:
  drift:
    name: schema-drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}

      - name: Install .NET
        run: |
          set -euo pipefail
          curl -sSL https://dot.net/v1/dotnet-install.sh \
            | bash -s -- --channel ${{ inputs.dotnet-channel }} --install-dir $HOME/.dotnet
          echo "$HOME/.dotnet" >> $GITHUB_PATH
          # Tools (dotnet-tool global tools, codegen helpers) need DOTNET_ROOT
          # to find the runtime — without it they die with
          # "You must install .NET to run this application."
          echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV

      - name: Install ${{ inputs.package-manager }} (+ Node 20)
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail

          # graphql-codegen's listr2 dep requires Node >= 20.12
          # (styleText from node:util).  The runner image bundles
          # Node 18 in /opt/hostedtoolcache/node and prepends it
          # to PATH via $GITHUB_PATH — NodeSource apt installs to
          # /usr/bin/node get shadowed and `node --version` still
          # reports v18.x.
          #
          # Previous fixes used NodeSource apt + symlinks in the
          # hostedtoolcache, but the NodeSource repo can flake (GPG
          # key rotation, apt lock, partial sync) and the glob
          # `/opt/hostedtoolcache/node/*/x64/bin` misses some
          # runner layouts.
          #
          # Strategy: download Node 20 directly from nodejs.org
          # dist CDN (no apt, no sudo for the download itself),
          # install to an isolated prefix $HOME/.node20, prepend
          # that to $GITHUB_PATH, then shadow every pre-installed
          # node/npm/npx so no PATH ordering can resurrect Node 18.

          # --- resolve architecture ---
          case "$(uname -m)" in
            x86_64)  NODE_ARCH=x64 ;;
            aarch64) NODE_ARCH=arm64 ;;
            *)       echo "::error::Unsupported arch $(uname -m)"; exit 1 ;;
          esac

          # --- download latest Node 20.x from nodejs.org ---
          TARBALL=$(curl -fsSL https://nodejs.org/dist/latest-v20.x/SHASUMS256.txt \
            | grep "linux-${NODE_ARCH}\.tar\.xz$" | head -1 | awk '{print $2}')
          if [ -z "$TARBALL" ]; then
            echo "::error::Could not resolve Node 20 tarball from dist index"
            exit 1
          fi
          mkdir -p "$HOME/.node20"
          curl -fsSL "https://nodejs.org/dist/latest-v20.x/${TARBALL}" \
            | tar -xJ -C "$HOME/.node20" --strip-components=1

          NODE_BIN="$HOME/.node20/bin"

          # Expose via $GITHUB_PATH (prepended in subsequent steps).
          echo "$NODE_BIN" >> "$GITHUB_PATH"

          # Belt-and-suspenders: overwrite every node/npm/npx the
          # runner pre-installed so even a PATH that prefers the old
          # location still executes Node 20.
          for bin in node npm npx; do
            sudo ln -sf "$NODE_BIN/$bin" "/usr/local/bin/$bin" 2>/dev/null || true
            sudo ln -sf "$NODE_BIN/$bin" "/usr/bin/$bin"       2>/dev/null || true
          done
          for d in /opt/hostedtoolcache/node/*/x64/bin /opt/hostedtoolcache/node/*/*/bin; do
            for bin in node npm npx; do
              if [ -e "$d/$bin" ] || [ -L "$d/$bin" ]; then
                sudo rm -f "$d/$bin"
                sudo ln -sf "$NODE_BIN/$bin" "$d/$bin" 2>/dev/null || true
              fi
            done
          done
          # Catch-all: find any other `node` on PATH and replace it.
          while IFS= read -r old_node; do
            case "$old_node" in
              "$NODE_BIN/"*) continue ;;   # don't replace our own
            esac
            sudo rm -f "$old_node"
            sudo ln -sf "$NODE_BIN/node" "$old_node" 2>/dev/null || true
          done < <(command -v -a node 2>/dev/null || true)

          hash -r
          # Sanity-check via absolute path: must be >= 20.12 for styleText.
          "$NODE_BIN/node" --version
          "$NODE_BIN/node" -e 'const {styleText}=require("node:util"); if(typeof styleText!=="function"){process.exit(1)}'

          case "$PM" in
            bun)
              curl -fsSL https://bun.sh/install | bash
              echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
              ;;
            pnpm)
              curl -fsSL https://get.pnpm.io/install.sh | env SHELL=bash sh -
              echo "$HOME/.local/share/pnpm" >> "$GITHUB_PATH"
              ;;
            npm)
              # Already installed with Node 20 above.
              ;;
            yarn)
              "$NODE_BIN/npm" install -g yarn
              ;;
            *)
              echo "::error::Unknown package-manager '$PM' (expected: bun, npm, pnpm, yarn)"
              exit 1
              ;;
          esac

      - name: Export schema from backend
        env:
          PROJECT: ${{ inputs.backend-project }}
          OUTPUT: ${{ inputs.schema-output }}
          EXTRA: ${{ inputs.schema-export-args }}
        run: |
          set -euo pipefail
          if [ -z "$EXTRA" ]; then
            EXTRA="--export-schema $(pwd)/$OUTPUT"
          fi
          ~/.dotnet/dotnet run --project "$PROJECT" -- $EXTRA

      - name: Run frontend codegen
        working-directory: ${{ inputs.frontend-dir }}
        env:
          PM: ${{ inputs.package-manager }}
          INSTALL: ${{ inputs.install-cmd }}
          CODEGEN: ${{ inputs.codegen-cmd }}
        run: |
          set -euo pipefail
          if [ -z "$INSTALL" ]; then
            case "$PM" in
              bun)  INSTALL="bun install --frozen-lockfile" ;;
              pnpm) INSTALL="pnpm install --frozen-lockfile" ;;
              npm)  INSTALL="npm ci" ;;
              yarn) INSTALL="yarn install --immutable" ;;
            esac
          fi
          if [ -z "$CODEGEN" ]; then
            CODEGEN="$PM run codegen"
          fi
          echo "::group::install"
          eval "$INSTALL"
          echo "::endgroup::"
          echo "::group::codegen"
          eval "$CODEGEN"
          echo "::endgroup::"

      - name: Fail on schema or generated-client drift
        env:
          OUTPUT: ${{ inputs.schema-output }}
          EXTRA_PATHS: ${{ inputs.drift-paths }}
        run: |
          set -euo pipefail
          paths=("$OUTPUT")
          # shellcheck disable=SC2206
          paths+=($EXTRA_PATHS)
          if ! git diff --exit-code -- "${paths[@]}"; then
            echo "::error::Schema or generated client is out of date — re-run the export + codegen locally and commit the result."
            echo "  ~/.dotnet/dotnet run --project ${{ inputs.backend-project }} -- --export-schema \$(pwd)/${{ inputs.schema-output }}"
            echo "  cd ${{ inputs.frontend-dir }} && ${{ inputs.package-manager }} run codegen"
            exit 1
          fi
